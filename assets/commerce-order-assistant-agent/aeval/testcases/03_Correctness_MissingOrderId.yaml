id: 03_Correctness_MissingOrderId
description: >
  UJ-02 — customer asks to track an order without providing an order ID.
  The agent must prompt for the order ID, then retrieve and return the order details once provided.
tags:
  - correctness
  - missing_input
test_steps:
  - type: dynamic_conversation
    user_agent:
      task_summary: |
        You are an e-commerce customer who wants to track your order but forgot to include the order ID.
        Your order ID is ORD-0005 but you do not mention it in your first message.
        Known information: once the agent asks, your order ID is ORD-0005.
        Unknown information: you do not know the current status or delivery date.
        When the agent asks for your order ID, respond with: 'It is ORD-0005'.
        Stop once the agent has told you the order status and estimated delivery date.
      initial_message: 'I want to check on my order, can you help?'
    max_turns: 6
    agent_response_validations:
      - check: 'The agent asks the customer to provide their order ID before attempting to look up any order information.'
      - check: 'After the customer supplies ORD-0005, the agent provides the order status and estimated delivery date drawn from the tool response.'
    rule_compliance_validations:
      - check: 'The agent does not state an order status or delivery date before the customer has provided an order ID — it prompts first.'
    tool_validations:
      expected_tool_calls:
        - tool: get_order_status
          parameters:
            order_id:
              value: 'ORD-0005'
          output:
            check: >
              The tool returns a non-error response for ORD-0005 with found=true and
              contains order_id, status, estimated_delivery_date, and item_description.
