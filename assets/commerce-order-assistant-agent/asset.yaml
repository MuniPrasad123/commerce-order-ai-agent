apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: commerce-order-assistant-agent
  description: AI-powered self-service agent for e-commerce order tracking. Provides order status and estimated delivery dates from simulated order data.
  version: "1.0.0"

provides:
  apis:
    - name: commerce-order-assistant-agent
      kind: a2a
      ordId: customer.build:apiResource:commerce-order-assistant.commerce-order-assistant-agent:v1

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
